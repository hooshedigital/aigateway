name: Gateway Security Regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gateway-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate gateway request handling
        run: node --experimental-strip-types --test tests/gateway-handler.test.mjs
